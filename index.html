<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #0B1826;
    --paper-line: #14293C;
    --paper-line-strong: rgba(255,255,255,0.09);
    --ink-dark: #F2F5F8;
    --ink-blue: #EA9D2B;
    --ink-red: #A13B2C;
    --ink-red-bright: #C24B36;
    --ink-green: var(--ink-red-bright);
    --ink-on-accent: #12283D;
    --tape: rgba(234,157,43,0.25);
    --card-bg: #12253A;
    --card-bg-done: #12253A;
    --card-shadow: rgba(0,0,0,0.3);
    --muted: #6E8299;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background: var(--paper);
    color: var(--ink-dark);
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;
    letter-spacing: 0.01em;
  }

  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding: 48px 24px 100px 24px;
    position:relative;
    z-index:1;
  }
  @media (max-width:640px){ .wrap{ padding: 28px 12px 90px 12px; } }

  header.page-head{ margin-bottom: 30px; }

  .eyebrow{
    font-size:11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-blue);
    margin-bottom: 10px;
    font-weight:600;
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: 38px;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--ink-dark);
    display:inline-block;
    position:relative;
    line-height:1.1;
  }
  h1 .underline{ display:none; }
  .subtitle{ font-size:12.5px; color: var(--muted); margin-top:10px; }

  .stats-row{
    display:flex;
    gap:0;
    flex-wrap:wrap;
    margin: 0 0 34px 0;
    border-top: 1px solid var(--paper-line-strong);
    border-bottom: 1px solid var(--paper-line-strong);
  }
  .stat-tag{
    background: transparent;
    border: none;
    border-right: 1px solid var(--paper-line-strong);
    border-radius: 0;
    padding: 12px 22px 12px 0;
    margin-right: 22px;
    font-size:10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    box-shadow: none;
  }
  .stat-tag:last-child{ border-right:none; margin-right:0; }
  .stat-tag b{
    font-family:'Space Grotesk', sans-serif;
    font-size:22px;
    font-weight:600;
    color: var(--ink-dark);
    display:block;
    letter-spacing:-0.01em;
    text-transform:none;
    margin-bottom:2px;
  }
  .stat-tag.streak b{ color: var(--ink-blue); }
  .stat-tag.best b{ color: var(--ink-red-bright); }
  .stat-tag.rate b{ color: var(--ink-dark); }

  .sync-panel{
    margin: 0 0 22px 0;
    padding: 12px 14px;
    border: 1px solid var(--paper-line-strong);
    border-radius: 6px;
    background: rgba(255,255,255,0.02);
  }
  .sync-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    font-size:10.5px;
    color: var(--muted);
  }
  .sync-label{ letter-spacing:0.03em; }
  .sync-panel input[type="text"]{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    padding:6px 8px;
    border: 1px solid var(--paper-line-strong);
    border-radius:3px;
    background: #081420;
    color: var(--ink-dark);
    min-width:160px;
    flex:1;
  }
  .sync-panel input[type="text"]:focus{ outline: 1px solid var(--ink-blue); }
  .sync-code{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color: var(--ink-blue);
    background: rgba(234,157,43,0.08);
    padding:3px 8px;
    border-radius:3px;
    letter-spacing:0.02em;
  }
  .sync-status{ font-size:10px; }
  .sync-status.ok{ color: var(--ink-blue); }
  .sync-status.err{ color: var(--ink-red-bright); }
  .sync-status.not-configured{ color: var(--muted); }
  .sync-hint{ font-size:9.5px; color: var(--muted); margin-top:6px; }

  .top-actions{
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom: 30px;
  }
  .jump-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.04em;
    background: transparent;
    color: var(--ink-blue);
    border: 1px solid var(--paper-line-strong);
    padding:8px 16px;
    border-radius: 3px;
    cursor:pointer;
    box-shadow: none;
    margin-bottom: 0;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .jump-btn:hover{ border-color: var(--ink-blue); background: rgba(234,157,43,0.08); }

  .shift-panel{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:10.5px;
    color: var(--muted);
    letter-spacing:0.02em;
    flex-wrap:wrap;
  }
  .shift-panel input{
    width:44px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    padding:5px 6px;
    border: 1px solid var(--paper-line-strong);
    border-radius:3px;
    background: #081420;
    color: var(--ink-dark);
    text-align:right;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .shift-panel input[type="date"]{ width:126px; text-align:left; }
  .shift-panel input::-webkit-outer-spin-button,
  .shift-panel input::-webkit-inner-spin-button{
    -webkit-appearance: none;
    margin: 0;
  }
  .shift-panel input:focus{ outline: 1px solid var(--ink-blue); }
  .shift-panel #shiftBtn{ font-size:11px; padding: 7px 12px; }

  .week-section{ margin-bottom: 40px; }
  .month-group{ margin-bottom: 16px; }
  .month-group > summary{
    list-style:none; cursor:pointer;
    display:flex; align-items:center; gap:12px;
    padding: 10px 0; border-bottom: 1px solid var(--paper-line-strong);
  }
  .month-group > summary::-webkit-details-marker{ display:none; }
  .month-group > summary .month-caret{ font-family:'JetBrains Mono', monospace; font-size:12px; color: var(--muted); width:20px; text-align:center; }
  .month-group[open] > summary .month-caret{ transform: rotate(90deg); }
  .month-group > summary h2{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15px; margin:0; color: var(--ink-dark); }
  .month-group > summary .month-stat{ font-size:10.5px; color: var(--muted); letter-spacing:0.03em; }
  .month-group[open] > .month-body{ padding-top: 16px; }
  .week-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
    padding-bottom:8px;
    border-bottom: 1px solid var(--paper-line-strong);
  }
  .week-toggle{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    width:20px; height:20px;
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    background: transparent;
    border: 1px solid var(--paper-line-strong);
    border-radius:4px;
    color: var(--muted);
    cursor:pointer;
    padding:0;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .week-toggle:hover{ border-color: var(--ink-blue); color: var(--ink-blue); }
  .week-head h2{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing: -0.01em;
    margin:0;
    color: var(--ink-dark);
  }
  .week-progress{
    font-size:10.5px;
    color: var(--muted);
    letter-spacing:0.03em;
  }

  .cardio-week-stat{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .cardio-week-label{
    font-size:10px;
    color: var(--muted);
    letter-spacing:0.03em;
    white-space:nowrap;
  }
  .cardio-week-stat.met .cardio-week-label{ color: var(--ink-blue); }
  .cardio-bar-track{
    width:70px;
    height:4px;
    background: var(--paper-line-strong);
    border-radius:2px;
    overflow:hidden;
  }
  .cardio-bar-fill{
    height:100%;
    background: var(--ink-blue);
    border-radius:2px;
  }
  .cardio-week-stat.met .cardio-bar-fill{ background: var(--ink-red-bright); }
  @media (max-width:520px){
    .week-head{ flex-wrap:wrap; }
    .cardio-week-stat{ margin-left:0; width:100%; }
  }

  .week-grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap:8px;
  }
  @media (max-width:820px){
    .week-grid{ grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); }
  }

  .day-cell{
    background: var(--card-bg);
    border: 1px solid var(--paper-line-strong);
    border-radius: 6px;
    padding: 10px;
    min-height:168px;
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow: none;
    transition: border-color 0.15s ease;
  }
  .day-cell:hover{ border-color: rgba(255,255,255,0.18); }
  .day-cell.today{ border-color: var(--ink-blue); }
  .day-cell.done{ background: var(--card-bg-done); opacity:0.82; }

  .day-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .day-head .dnum{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:16px; }
  .day-head .dow{ font-size:9.5px; color: var(--muted); text-transform:uppercase; letter-spacing:0.06em; }

  .ex-item{ margin-bottom:8px; }
  .ex-thumb-wrap{
    position:relative;
    width:100%;
    aspect-ratio: 16/9;
    border-radius:5px;
    overflow:hidden;
    border:1px solid transparent;
    background:#0C1D2E;
    transition: border-color 0.15s ease;
    margin-bottom:4px;
  }
  .ex-thumb-wrap.selected{ border-color: var(--ink-blue); box-shadow: 0 0 0 1px var(--ink-blue); }
  .ex-thumb-link{ display:block; width:100%; height:100%; }
  .ex-thumb-link img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ex-thumb-wrap.thumb-broken{
    display:flex; align-items:center; justify-content:center;
  }
  .ex-thumb-wrap.thumb-broken::before{
    content:"clip unavailable";
    font-size:9.5px;
    color: var(--muted);
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .ex-thumb-wrap .play-mini{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(0,0,0,0.18);
    pointer-events:none;
  }
  .ex-thumb-wrap .play-mini::after{
    content:"";
    width:30px; height:30px;
    border-radius:50%;
    background: rgba(0,0,0,0.55);
    display:block;
  }
  .ex-thumb-wrap .play-mini::before{
    content:"";
    position:absolute; top:50%; left:50%;
    transform: translate(-40%,-50%);
    border-style: solid;
    border-width: 7px 0 7px 11px;
    border-color: transparent transparent transparent #fff;
    z-index:1;
  }
  .ex-thumb-wrap .del-x{
    position:absolute; top:4px; right:4px;
    background: rgba(0,0,0,0.7);
    color:#fff;
    font-size:11px;
    width:20px; height:20px;
    border:none;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    line-height:1;
    cursor:pointer;
    z-index:2;
  }
  .ex-thumb-wrap .del-x:hover{ background: rgba(0,0,0,0.9); }
  .tag-row{
    display:flex;
    align-items:stretch;
    gap:4px;
  }
  .ex-tag{
    display:block;
    flex:1;
    min-width:0;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    padding:5px 7px;
    border-radius:3px;
    border: 1px solid var(--paper-line-strong);
    background: transparent;
    color: var(--muted);
    cursor:pointer;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .ex-tag:hover{ border-color: var(--ink-blue); color: var(--ink-blue); }
  .ex-tag.selected{
    border-color: var(--ink-blue);
    color: var(--ink-blue);
    background: rgba(234,157,43,0.1);
  }
  .edit-tag-btn{
    flex:0 0 auto;
    width:22px;
    font-size:10px;
    border-radius:3px;
    border: 1px solid var(--paper-line-strong);
    background: transparent;
    color: var(--muted);
    cursor:pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .edit-tag-btn:hover{ border-color: var(--ink-blue); color: var(--ink-blue); }

  .add-ex-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--paper-line-strong);
    border-radius:4px;
    padding: 5px 6px;
    cursor:pointer;
    width:100%;
    margin-bottom:6px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .add-ex-btn:hover{ border-color: var(--ink-blue); color: var(--ink-blue); }

  .mini-form{
    display:none;
    flex-direction:column;
    gap:4px;
    margin-bottom:6px;
    background: rgba(0,0,0,0.18);
    border: 1px solid var(--paper-line-strong);
    border-radius:4px;
    padding:6px;
  }
  .mini-form.open{ display:flex; }
  .edit-clip-form{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-bottom:6px;
    background: rgba(0,0,0,0.18);
    border: 1px solid var(--ink-blue);
    border-radius:4px;
    padding:6px;
  }
  .mini-form input, .edit-clip-form input{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    padding:5px 6px;
    border: 1px solid var(--paper-line-strong);
    border-radius:3px;
    background: #081420;
    color: var(--ink-dark);
  }
  .mini-form input:focus, .edit-clip-form input:focus{ outline: 1px solid var(--ink-blue); }
  .mini-form input.locked{
    color: var(--ink-blue);
    border-color: var(--ink-blue);
    background: rgba(234,157,43,0.06);
  }
  .mini-form .mf-row, .edit-clip-form .mf-row{ display:flex; gap:4px; }
  .mini-form button, .edit-clip-form button{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:11px;
    border:none;
    border-radius:3px;
    padding:5px 8px;
    cursor:pointer;
  }
  .mini-form .mf-add, .edit-clip-form .mf-add{ background: var(--ink-blue); color: var(--ink-on-accent); flex:1; }
  .mini-form .mf-cancel, .edit-clip-form .mf-cancel{ background: transparent; color: var(--muted); border:1px solid var(--paper-line-strong); }
  .mf-err{ font-size:9px; color: var(--ink-red-bright); min-height:11px; }
  .mf-hint{ font-size:9px; color: var(--ink-blue); min-height:11px; }

  .chosen-line{
    font-size:10.5px;
    color: var(--ink-blue);
    margin-bottom:6px;
    word-break: break-word;
    line-height:1.3;
  }

  .cardio-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:8px;
  }
  .cardio-label{
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: var(--muted);
  }
  .cardio-input{
    width:44px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    padding:3px 5px;
    border: 1px solid var(--paper-line-strong);
    border-radius:3px;
    background: #081420;
    color: var(--ink-dark);
    text-align:right;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .cardio-input::-webkit-outer-spin-button,
  .cardio-input::-webkit-inner-spin-button{
    -webkit-appearance: none;
    margin: 0;
  }
  .cardio-input:focus{ outline: 1px solid var(--ink-blue); }
  .cardio-unit{ font-size:9.5px; color: var(--muted); }

  .day-foot{ margin-top:auto; }
  .done-btn{
    width:100%;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:11.5px;
    padding:6px 0;
    border-radius:4px;
    border: 1px solid var(--paper-line-strong);
    background: transparent;
    color: var(--muted);
    cursor:pointer;
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .done-btn:hover:not(:disabled){ border-color: var(--ink-blue); color: var(--ink-blue); }
  .done-btn:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .done-btn.is-done{
    background: var(--ink-red-bright);
    border-color: var(--ink-red-bright);
    color: var(--ink-dark);
  }

  .backup-bar{
    display:flex; gap:10px; margin-top: 44px; padding-top: 18px;
    border-top: 1px solid var(--paper-line-strong);
    font-size:10.5px; flex-wrap:wrap; align-items:center;
    color: var(--muted);
  }
  .ghost-btn{
    font-family:'JetBrains Mono', monospace; font-size:10.5px;
    background: transparent; border: 1px solid var(--paper-line-strong);
    color: var(--muted); padding: 6px 12px; border-radius: 4px; cursor:pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .ghost-btn:hover{ border-color: var(--ink-blue); color: var(--ink-blue); }
  input[type=file]{ display:none; }



  @media (prefers-reduced-motion: reduce){ * { transition:none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="page-head">
    <div class="eyebrow">Training Log</div>
    <h1>Aug 23, 2026 — Jan 2, 2027</h1>
    <div class="subtitle">19 weeks · paste a clip, pick the one you're doing, check it off</div>
  </header>

  <div class="stats-row" id="statsRow"></div>
  <div class="sync-panel" id="syncPanel"></div>
  <div class="top-actions">
    <button class="jump-btn" id="jumpToday">jump to this week ↓</button>
    <div class="shift-panel">
      <label for="shiftFromInput">shift from</label>
      <input type="date" id="shiftFromInput" min="2026-08-23" max="2026-10-31">
      <label for="shiftDaysInput">forward by</label>
      <input type="number" id="shiftDaysInput" min="1" max="60" value="1">
      <span>days</span>
      <button class="ghost-btn" id="shiftBtn">shift</button>
    </div>
  </div>

  <div id="weeksContainer"></div>

  <div class="backup-bar">
    <span>data saves in this browser —</span>
    <button class="ghost-btn" id="exportBtn">export backup</button>
    <button class="ghost-btn" id="importBtn">import backup</button>
    <input type="file" id="importFile" accept="application/json">
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  }

  let state = loadState();
  let data = state.days; // { 'YYYY-MM-DD': { exercises:[{id,url}], selectedIds:[], done:false, cardioMins:0 } }
  let videoTags = state.videoTags; // { videoId: "exercise name" } — one name per clip, shared everywhere it's used
  migrateSelection();
  migrateVideoTags();
  let openFormDate = null; // which day's add-form is currently open
  let editingClip = null; // "date#exerciseId" of the clip currently in its edit form, or null

  async function pullRemote(key){
    const { data: rows, error } = await sb.from(SYNC_TABLE).select('payload').eq('sync_key', key).maybeSingle();
    if(error) throw error;
    return rows ? rows.payload : null;
  }
  async function pushRemote(key, payload){
    const { error } = await sb.from(SYNC_TABLE).upsert(
      { sync_key: key, payload: payload, updated_at: new Date().toISOString() },
      { onConflict: 'sync_key' }
    );
    if(error) throw error;
  }

  function scheduleSync(){
    if(!syncKey || !sb) return;
    syncStatus = 'syncing';
    renderSyncPanel();
    clearTimeout(syncDebounceTimer);
    syncDebounceTimer = setTimeout(function(){
      pushRemote(syncKey, { days: data, videoTags: videoTags })
        .then(function(){ syncStatus = 'synced'; renderSyncPanel(); })
        .catch(function(err){ console.error(err); syncStatus = 'error'; renderSyncPanel(); });
    }, 600);
  }

  function connectSync(rawKey){
    const key = (rawKey || '').trim();
    if(!key){ alert('enter a sync code'); return; }
    if(!sb){ alert('sync backend is not configured yet — see README.md'); return; }
    syncStatus = 'syncing';
    renderSyncPanel();
    pullRemote(key).then(function(remote){
      if(remote){
        data = remote.days || {};
        videoTags = remote.videoTags || {};
        migrateSelection();
        migrateVideoTags();
        syncKey = key;
        saveSyncKeyLocal(key);
        state.days = data; state.videoTags = videoTags;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        syncStatus = 'synced';
        renderAll();
        renderSyncPanel();
        if(!applyPlan()) resolveBodyParts();
      } else {
        syncKey = key;
        saveSyncKeyLocal(key);
        return pushRemote(key, { days: data, videoTags: videoTags }).then(function(){
          syncStatus = 'synced';
          renderSyncPanel();
        });
      }
    }).catch(function(err){
      console.error(err);
      syncStatus = 'error';
      renderSyncPanel();
      alert('could not reach the sync backend — check the code and your connection');
    });
  }

  function disconnectSync(){
    syncKey = null;
    clearSyncKeyLocal();
    syncStatus = 'idle';
    renderSyncPanel();
  }

  function renderSyncPanel(){
    const el = document.getElementById('syncPanel');
    if(!el) return;
    if(!sb){
      el.innerHTML = `
        <div class="sync-row">
          <span class="sync-label">cross-device sync:</span>
          <span class="sync-status not-configured">not set up — see README.md</span>
        </div>`;
      return;
    }
    if(!syncKey){
      el.innerHTML = `
        <div class="sync-row">
          <span class="sync-label">sync across devices:</span>
          <input type="text" id="syncKeyInput" placeholder="pick or paste a sync code">
          <button class="ghost-btn" id="connectSyncBtn">connect</button>
        </div>
        <div class="sync-hint">new code = starts a fresh synced log here. existing code from another device = pulls that log down here.</div>`;
      document.getElementById('connectSyncBtn').addEventListener('click', function(){
        connectSync(document.getElementById('syncKeyInput').value);
      });
    } else {
      const labels = { syncing:'syncing…', synced:'synced ✓', error:'sync error — retrying on next change' };
      const cls = syncStatus === 'error' ? 'err' : (syncStatus === 'synced' ? 'ok' : '');
      el.innerHTML = `
        <div class="sync-row">
          <span class="sync-label">synced with code:</span>
          <code class="sync-code">${escapeHtml(syncKey)}</code>
          <span class="sync-status ${cls}">${labels[syncStatus] || syncStatus}</span>
          <button class="ghost-btn" id="disconnectSyncBtn">disconnect</button>
        </div>`;
      document.getElementById('disconnectSyncBtn').addEventListener('click', disconnectSync);
    }
  }

  function loadCollapsed(){
    try{
      const raw = localStorage.getItem('trainingLogCollapsedWeeks');
      return raw ? new Set(JSON.parse(raw)) : new Set();
    }catch(e){ return new Set(); }
  }
  function saveCollapsed(){
    localStorage.setItem('trainingLogCollapsedWeeks', JSON.stringify([...collapsedWeeks]));
  }
  let collapsedWeeks = loadCollapsed(); // Set of week-index strings
  let openMonths = (() => { try { return new Set(JSON.parse(localStorage.getItem('trainingLogOpenMonths') || '[]')); } catch(e){ return new Set(); } })();
  document.addEventListener('toggle', e => {
    const el = e.target;
    if(!el.classList || !el.classList.contains('month-group')) return;
    if(el.open) openMonths.add(el.dataset.month); else openMonths.delete(el.dataset.month);
    try { localStorage.setItem('trainingLogOpenMonths', JSON.stringify([...openMonths])); } catch(err){}
  }, true);

  function ensureDay(dateStr){
    if(!data[dateStr]) data[dateStr] = { exercises: [], selectedIds: [], done: false, cardioMins: 0 };
    if(data[dateStr].cardioMins === undefined) data[dateStr].cardioMins = 0;
    if(!Array.isArray(data[dateStr].selectedIds)) data[dateStr].selectedIds = [];
    return data[dateStr];
  }

  // one-time migration: old format used a single `selectedId` field
  function migrateSelection(){
    let changed = false;
    Object.keys(data).forEach(ds => {
      const d = data[ds];
      if(d && !Array.isArray(d.selectedIds)){
        d.selectedIds = d.selectedId ? [d.selectedId] : [];
        delete d.selectedId;
        changed = true;
      }
    });
    if(changed) save();
  }

  // one-time migration: exercises used to carry their own `title`; pull the
  // first one seen per video into the shared registry.
  function migrateVideoTags(){
    let changed = false;
    Object.keys(data).forEach(ds => {
      const d = data[ds];
      if(!d || !d.exercises) return;
      d.exercises.forEach(ex => {
        const vid = extractYouTubeId(ex.url);
        if(vid && ex.title && !videoTags[vid]){
          videoTags[vid] = ex.title;
          changed = true;
        }
      });
    });
    if(changed) save();
  }

  function extractYouTubeId(url){
    if(!url) return null;
    const patterns = [
      /(?:youtube\.com\/watch\?v=)([\w-]{11})/,
      /(?:youtu\.be\/)([\w-]{11})/,
      /(?:youtube\.com\/embed\/)([\w-]{11})/,
      /(?:youtube\.com\/shorts\/)([\w-]{11})/
    ];
    for(const p of patterns){ const m = url.match(p); if(m) return m[1]; }
    return null;
  }

  function toDate(s){ return new Date(s + 'T00:00:00'); }
  function fmt(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function todayStr(){ return fmt(new Date()); }
  function addDaysStr(dateStr, n){
    const d = toDate(dateStr);
    d.setDate(d.getDate() + n);
    return fmt(d);
  }

  function buildWeeks(){
    const weeks = [];
    let cursor = toDate(RANGE_START);
    const end = toDate(RANGE_END);
    while(cursor <= end){
      const week = [];
      for(let i=0;i<7;i++){
        week.push(fmt(cursor));
        cursor.setDate(cursor.getDate()+1);
      }
      weeks.push(week);
    }
    return weeks;
  }
  const WEEKS = buildWeeks();

  function escapeHtml(str){
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function weekLabel(week){
    const a = toDate(week[0]), b = toDate(week[6]);
    const optsA = { month:'short', day:'numeric' };
    const optsB = a.getMonth() === b.getMonth() ? { day:'numeric' } : { month:'short', day:'numeric' };
    return `Week of ${a.toLocaleDateString(undefined,optsA)} – ${b.toLocaleDateString(undefined,optsB)}, ${b.getFullYear()}`;
  }

  function computeStats(){
    const allDates = WEEKS.flat(); // chronological, ascending
    let doneDays = 0;
    allDates.forEach(ds => {
      const d = data[ds];
      if(d && d.done) doneDays++;
    });

    // current streak: consecutive done days counting back from today. Only
    // *today* gets a grace period for not being done yet (the day isn't over) —
    // any earlier day that's already passed and wasn't marked done breaks the
    // streak, same as a real habit tracker.
    const past = allDates.filter(ds => ds <= todayStr()).slice().reverse(); // most recent first
    let streak = 0;
    const todayIsDone = past.length > 0 && data[past[0]] && data[past[0]].done;
    const startIdx = todayIsDone ? 0 : 1; // skip an unfinished "today" only
    for(let i = startIdx; i < past.length; i++){
      if(data[past[i]] && data[past[i]].done) streak++;
      else break;
    }

    // best streak: the longest unbroken run of done days anywhere in the range
    let best = 0, run = 0;
    allDates.forEach(ds => {
      if(data[ds] && data[ds].done){ run++; if(run > best) best = run; }
      else run = 0;
    });

    return { doneDays, streak, best, totalDays: allDates.length };
  }

  function renderStats(){
    const s = computeStats();
    document.getElementById('statsRow').innerHTML = `
      <div class="stat-tag"><b>${s.doneDays}/${s.totalDays}</b>days done</div>
      <div class="stat-tag streak"><b>${s.streak}</b>day streak</div>
      <div class="stat-tag best"><b>${s.best}</b>best streak</div>
    `;
  }

  function renderDayCell(dateStr){
    const d = data[dateStr] || { exercises:[], selectedIds:[], done:false, cardioMins:0 };
    const dt = toDate(dateStr);
    const isToday = dateStr === todayStr();
    const items = d.exercises.map(ex => {
      if(!ex.url && ex.name){
        const isSelN = d.selectedIds.includes(ex.id);
        return `
        <div class="ex-item">
          <div class="tag-row">
            <button class="ex-tag ${isSelN?'selected':''}" data-select-ex="${ex.id}" data-date="${dateStr}">
              ${isSelN?'✓ ':''}${escapeHtml(ex.name)}
            </button>
            <button class="edit-tag-btn" data-del-ex="${ex.id}" data-date="${dateStr}" title="remove">✕</button>
          </div>
        </div>`;
      }
      const vid = extractYouTubeId(ex.url);
      const isSel = d.selectedIds.includes(ex.id);
      const currentName = (vid && videoTags[vid]) || 'exercise';
      const safeTitle = escapeHtml(currentName);
      const safeUrl = escapeHtml(ex.url);
      const clipKey = dateStr + '#' + ex.id;
      const isEditing = editingClip === clipKey;
      const img = vid
        ? `<img src="https://i.ytimg.com/vi/${vid}/hqdefault.jpg" alt="${safeTitle}" loading="lazy" referrerpolicy="no-referrer"
             onerror="if(this.dataset.step==='1'){this.style.display='none';this.parentElement.classList.add('thumb-broken');}else{this.dataset.step='1';this.src='https://img.youtube.com/vi/${vid}/hqdefault.jpg';}">`
        : '';

      const thumbBlock = `
          <div class="ex-thumb-wrap ${isSel?'selected':''}">
            <a class="ex-thumb-link" href="${safeUrl}" target="_blank" rel="noopener noreferrer" title="Watch on YouTube: ${safeTitle}">
              ${img}
              <div class="play-mini"></div>
            </a>
            <button class="del-x" data-del-ex="${ex.id}" data-date="${dateStr}" title="remove">✕</button>
          </div>`;

      if(isEditing){
        return `
        <div class="ex-item">
          ${thumbBlock}
          <div class="edit-clip-form">
            <input type="text" class="edit-clip-input" data-editfield="url" value="${safeUrl}" placeholder="YouTube link" maxlength="200">
            <input type="text" class="edit-clip-input" data-editfield="name" value="${escapeHtml(currentName === 'exercise' ? '' : currentName)}" placeholder="exercise name" maxlength="60">
            <div class="mf-err" data-edit-err></div>
            <div class="mf-row">
              <button type="button" class="mf-add" data-save-edit-clip="${ex.id}" data-date="${dateStr}">save</button>
              <button type="button" class="mf-cancel" data-cancel-edit-clip="1">cancel</button>
            </div>
          </div>
        </div>`;
      }

      return `
        <div class="ex-item">
          ${thumbBlock}
          <div class="tag-row">
            <button class="ex-tag ${isSel?'selected':''}" data-select-ex="${ex.id}" data-date="${dateStr}">
              ${isSel?'✓ ':''}${safeTitle}
            </button>
            <button class="edit-tag-btn" data-toggle-edit-clip="${clipKey}" title="edit link or name">✎</button>
          </div>
        </div>`;
    }).join('');

    const formOpen = openFormDate === dateStr;

    return `
      <div class="day-cell ${isToday?'today':''} ${d.done?'done':''}" data-date="${dateStr}">
        <div class="day-head">
          <span class="dnum">${dt.getDate()}</span>
          <span class="dow">${DOW[dt.getDay()]}${isToday?' · today':''}</span>
        </div>
        <div class="ex-items">${items}</div>
        <button class="add-ex-btn" data-toggle-form="${dateStr}">${formOpen ? '– cancel' : '+ add clip'}</button>
        <div class="mini-form ${formOpen?'open':''}" data-form-for="${dateStr}">
          <input type="text" placeholder="YouTube link" data-field="url" maxlength="200">
          <input type="text" placeholder="exercise name" data-field="title" maxlength="60">
          <div class="mf-hint" data-hint></div>
          <div class="mf-err" data-err></div>
          <div class="mf-row">
            <button type="button" class="mf-add" data-submit-form="${dateStr}">add</button>
          </div>
        </div>
        <div class="cardio-row">
          <label class="cardio-label" for="cardio-${dateStr}">cardio</label>
          <input type="number" id="cardio-${dateStr}" class="cardio-input" min="0" max="600" step="5"
                 value="${d.cardioMins || ''}" placeholder="0" data-cardio-input="${dateStr}">
          <span class="cardio-unit">min</span>
        </div>
        <div class="day-foot">
          <button class="done-btn ${d.done?'is-done':''}" data-toggle-done="${dateStr}" ${d.selectedIds.length===0?'disabled':''} title="${d.selectedIds.length===0 ? 'pick at least one exercise below first' : ''}">
            ${d.done ? '✓ done' : 'mark done'}
          </button>
        </div>
      </div>`;
  }

  function renderWeeks(){
    const container = document.getElementById('weeksContainer');
    const sectionHtml = (week, wi) => {
      const wiStr = String(wi);
      const collapsed = collapsedWeeks.has(wiStr);
      const doneCount = week.filter(ds => data[ds] && data[ds].done).length;
      const cardioTotal = week.reduce((sum, ds) => sum + ((data[ds] && data[ds].cardioMins) || 0), 0);
      const cardioPct = Math.min(100, Math.round((cardioTotal / CARDIO_GOAL) * 100));
      const goalMet = cardioTotal >= CARDIO_GOAL;
      return `
        <section class="week-section" id="week-${wi}" data-week-index="${wi}">
          <div class="week-head">
            <button class="week-toggle" data-toggle-week="${wi}" aria-expanded="${!collapsed}">${collapsed?'▸':'▾'}</button>
            <h2>${weekLabel(week)}</h2>
            <span class="week-progress">${doneCount}/7 done</span>
            <div class="cardio-week-stat ${goalMet?'met':''}">
              <span class="cardio-week-label">cardio ${cardioTotal}/${CARDIO_GOAL} min${goalMet?' ✓':''}</span>
              <div class="cardio-bar-track"><div class="cardio-bar-fill" style="width:${cardioPct}%"></div></div>
            </div>
          </div>
          <div class="week-grid" ${collapsed?'style="display:none"':''}>
            ${week.map(renderDayCell).join('')}
          </div>
        </section>`;
    };
    // a week belongs to the month holding most of its days (= its middle day);
    // months whose last week has fully passed fold into one collapsible group
    const today = todayStr();
    const groups = [];
    WEEKS.forEach((week, wi) => {
      const mk = week[3].slice(0,7);
      const g = groups[groups.length-1];
      if(g && g.mk === mk) g.items.push(wi); else groups.push({ mk, items:[wi] });
    });
    container.innerHTML = groups.map(g => {
      const lastDay = WEEKS[g.items[g.items.length-1]][6];
      const inner = g.items.map(wi => sectionHtml(WEEKS[wi], wi)).join('');
      if(lastDay >= today) return inner;
      const days = g.items.flatMap(wi => WEEKS[wi]);
      const done = days.filter(ds => data[ds] && data[ds].done).length;
      const cardio = days.reduce((s, ds) => s + ((data[ds] && data[ds].cardioMins) || 0), 0);
      const label = toDate(g.mk + '-01').toLocaleDateString('en-US', { month:'long', year:'numeric' });
      return `
        <details class="month-group" data-month="${g.mk}" ${openMonths.has(g.mk)?'open':''}>
          <summary>
            <span class="month-caret">▸</span>
            <h2>${label}</h2>
            <span class="month-stat">${g.items.length} week${g.items.length>1?"s":""} · ${done}/${days.length} done · cardio ${cardio} min</span>
          </summary>
          <div class="month-body">${inner}</div>
        </details>`;
    }).join('');
  }

  function renderAll(){ renderStats(); renderWeeks(); }

  // --- Event delegation ---
  document.getElementById('weeksContainer').addEventListener('click', function(e){

    const toggleWeekEl = e.target.closest('[data-toggle-week]');
    if(toggleWeekEl){
      const wi = toggleWeekEl.dataset.toggleWeek;
      if(collapsedWeeks.has(wi)) collapsedWeeks.delete(wi); else collapsedWeeks.add(wi);
      saveCollapsed();
      const section = document.getElementById('week-'+wi);
      const grid = section.querySelector('.week-grid');
      const nowCollapsed = collapsedWeeks.has(wi);
      grid.style.display = nowCollapsed ? 'none' : '';
      toggleWeekEl.textContent = nowCollapsed ? '▸' : '▾';
      toggleWeekEl.setAttribute('aria-expanded', String(!nowCollapsed));
      return;
    }

    const delEl = e.target.closest('[data-del-ex]');
    if(delEl){
      const ds = delEl.dataset.date, id = delEl.dataset.delEx;
      const d = ensureDay(ds);
      d.exercises = d.exercises.filter(x => x.id !== id);
      d.selectedIds = d.selectedIds.filter(sid => sid !== id);
      if(d.selectedIds.length === 0) d.done = false;
      save(); renderAll();
      return;
    }

    const selEl = e.target.closest('[data-select-ex]');
    if(selEl){
      const ds = selEl.dataset.date, id = selEl.dataset.selectEx;
      const d = ensureDay(ds);
      if(d.selectedIds.includes(id)){
        d.selectedIds = d.selectedIds.filter(sid => sid !== id);
      } else {
        d.selectedIds.push(id);
      }
      if(d.selectedIds.length === 0) d.done = false;
      save(); renderAll();
      return;
    }

    const toggleEditEl = e.target.closest('[data-toggle-edit-clip]');
    if(toggleEditEl){
      const key = toggleEditEl.dataset.toggleEditClip;
      editingClip = (editingClip === key) ? null : key;
      renderWeeks();
      return;
    }

    const cancelEditEl = e.target.closest('[data-cancel-edit-clip]');
    if(cancelEditEl){
      editingClip = null;
      renderWeeks();
      return;
    }

    const saveEditEl = e.target.closest('[data-save-edit-clip]');
    if(saveEditEl){
      const ds = saveEditEl.dataset.date, id = saveEditEl.dataset.saveEditClip;
      const formEl = saveEditEl.closest('.edit-clip-form');
      const urlVal = formEl.querySelector('[data-editfield="url"]').value.trim();
      const nameVal = formEl.querySelector('[data-editfield="name"]').value.trim();
      const errEl = formEl.querySelector('[data-edit-err]');
      const vid = extractYouTubeId(urlVal);
      if(!urlVal || !vid){
        errEl.textContent = "paste a valid YouTube link";
        return;
      }
      const d = ensureDay(ds);
      const ex = d.exercises.find(x => x.id === id);
      if(!ex) return;
      ex.url = urlVal;
      videoTags[vid] = nameVal || 'exercise';
      editingClip = null;
      save(); renderAll();
      return;
    }

    const toggleFormEl = e.target.closest('[data-toggle-form]');
    if(toggleFormEl){
      const ds = toggleFormEl.dataset.toggleForm;
      openFormDate = (openFormDate === ds) ? null : ds;
      renderWeeks();
      return;
    }

    const submitEl = e.target.closest('[data-submit-form]');
    if(submitEl){
      const ds = submitEl.dataset.submitForm;
      const formEl = document.querySelector(`[data-form-for="${ds}"]`);
      const titleInput = formEl.querySelector('[data-field="title"]');
      const url = formEl.querySelector('[data-field="url"]').value.trim();
      const errEl = formEl.querySelector('[data-err]');
      const vid = extractYouTubeId(url);
      if(!url && titleInput.value.trim()){
        // name-only entry (e.g. a body part to work) — no clip attached
        const dn = ensureDay(ds);
        dn.exercises.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), url: '', name: titleInput.value.trim() });
        openFormDate = null;
        save(); renderAll();
        return;
      }
      if(!url || !vid){
        errEl.textContent = "paste a valid YouTube link, or just a name";
        return;
      }
      // one name per clip: if this video already has a registered tag, keep
      // using it; otherwise register whatever the user typed (or a default)
      if(!videoTags[vid]){
        videoTags[vid] = titleInput.value.trim() || 'exercise';
      }
      const d = ensureDay(ds);
      d.exercises.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), url });
      openFormDate = null;
      save(); renderAll();
      return;
    }

    const doneEl = e.target.closest('[data-toggle-done]');
    if(doneEl){
      if(doneEl.disabled) return;
      const ds = doneEl.dataset.toggleDone;
      const d = ensureDay(ds);
      d.done = !d.done;
      save(); renderAll();
      return;
    }
  });

  // --- Live auto-fill: if the pasted link is already tagged elsewhere, use
  // that name automatically (and lock the field, since one clip = one tag) ---
  document.getElementById('weeksContainer').addEventListener('input', function(e){
    const urlEl = e.target.closest('[data-field="url"]');
    if(!urlEl) return;
    const formEl = urlEl.closest('.mini-form');
    if(!formEl) return;
    const titleEl = formEl.querySelector('[data-field="title"]');
    const hintEl = formEl.querySelector('[data-hint]');
    const vid = extractYouTubeId(urlEl.value.trim());
    if(vid && videoTags[vid]){
      titleEl.value = videoTags[vid];
      titleEl.setAttribute('readonly', 'readonly');
      titleEl.classList.add('locked');
      hintEl.textContent = 'already tagged — using the saved name';
    } else {
      titleEl.removeAttribute('readonly');
      titleEl.classList.remove('locked');
      hintEl.textContent = '';
    }
  });

  // --- Cardio minutes input (fires on blur / enter, not every keystroke) ---
  document.getElementById('weeksContainer').addEventListener('change', function(e){
    const cardioEl = e.target.closest('[data-cardio-input]');
    if(cardioEl){
      const ds = cardioEl.dataset.cardioInput;
      const d = ensureDay(ds);
      let val = parseInt(cardioEl.value, 10);
      if(isNaN(val) || val < 0) val = 0;
      if(val > 600) val = 600;
      d.cardioMins = val;
      save(); renderAll();
    }
  });

  // --- Jump to current week ---
  document.getElementById('jumpToday').addEventListener('click', function(){
    const t = todayStr();
    const idx = WEEKS.findIndex(w => w.includes(t));
    const targetIdx = idx === -1 ? (t < RANGE_START ? 0 : WEEKS.length-1) : idx;
    const el = document.getElementById('week-'+targetIdx);
    if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  });

  // --- Shift a chosen date (and everything after it) forward by N days ---
  function shiftFutureDays(pivot, n){
    const allDates = WEEKS.flat(); // ascending, fixed 70-day range
    const newData = {};
    // days before the chosen pivot are untouched
    allDates.forEach(ds => { if(ds < pivot && data[ds]) newData[ds] = data[ds]; });
    // pivot and every day after it move forward by n; anything that lands
    // past Jan 2 falls out of the tracked range and is dropped
    allDates.forEach(ds => {
      if(ds >= pivot && data[ds]){
        const shifted = addDaysStr(ds, n);
        if(shifted >= RANGE_START && shifted <= RANGE_END){
          newData[shifted] = data[ds];
        }
      }
    });
    data = newData;
    save();
    renderAll();
  }

  document.getElementById('shiftBtn').addEventListener('click', function(){
    const dateInput = document.getElementById('shiftFromInput');
    const daysInput = document.getElementById('shiftDaysInput');
    const pivot = dateInput.value;
    const n = parseInt(daysInput.value, 10);
    if(!pivot || pivot < RANGE_START || pivot > RANGE_END){
      alert('pick a valid date within Aug 23, 2026 – Jan 2, 2027');
      return;
    }
    if(!n || n < 1){
      alert('enter a number of days to shift by (1 or more)');
      return;
    }
    const allDates = WEEKS.flat();
    const affected = allDates.filter(ds => ds >= pivot && data[ds] &&
      ((data[ds].exercises && data[ds].exercises.length) || data[ds].done || data[ds].cardioMins));
    const overflow = affected.filter(ds => addDaysStr(ds, n) > RANGE_END);
    let msg = `Shift ${pivot} and every day after it forward by ${n} day${n===1?'':'s'}?`;
    if(overflow.length > 0){
      msg += `\n\n${overflow.length} day(s) with data would land after Jan 2 and be lost.`;
    }
    if(!window.confirm(msg)) return;
    shiftFutureDays(pivot, n);
  });

  // body part comes from the YouTube titles of the day's two Frieza clips
  const PART_WORDS = ['full body','upper body','lower body','chest','back','shoulders','shoulder','delts','arms','biceps','triceps','forearms','legs','leg','arm','quads','hamstrings','glutes','calves','abs','core','push','pull'];
  const titleCache = {};
  async function fetchTitle(vid){
    if(titleCache[vid]) return titleCache[vid];
    const tries = [
      'https://noembed.com/embed?url=' + encodeURIComponent(ytUrl(vid)),
      'https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(ytUrl(vid))
    ];
    for(const u of tries){
      try{
        const r = await fetch(u);
        if(!r.ok) continue;
        const j = await r.json();
        if(j && j.title){ titleCache[vid] = j.title; return j.title; }
      }catch(e){}
    }
    return null;
  }
  function partsFromTitle(t){
    const low = t.toLowerCase(), found = [];
    PART_WORDS.forEach(w => {
      const i = low.search(new RegExp('\\b' + w + '\\b'));
      if(i >= 0 && !found.some(f => f.w.includes(w) || w.includes(f.w))) found.push({ w, i });
    });
    const norm = { leg:'legs', arm:'arms', shoulder:'shoulders', delts:'shoulders' };
    const out = [];
    found.sort((a,b) => a.i - b.i).forEach(f => { const w = (norm[f.w] || f.w).replace(/\b\w/g, c => c.toUpperCase()); if(!out.includes(w)) out.push(w); });
    return out;
  }
  async function resolveBodyParts(){
    let changed = false;
    for(const ds of Object.keys(data)){
      const d = data[ds];
      if(!d || !d.exercises) continue;
      for(const ex of d.exercises){
        if(!ex.autoPart || ex.partV === 2) continue;
        const titles = await Promise.all(ex.autoPart.map(fetchTitle));
        if(titles.some(t => !t)) continue; // retry on next load
        // drop Frieza abs/core clips from the day; body part = the rest
        const isAbsPart = p => p === 'Abs' || p === 'Core';
        const absClip = titles.map(t => { const ps = partsFromTitle(t); return ps.length > 0 && ps.every(isAbsPart) || /six ?pack/i.test(t); });
        if(absClip.some(x => !x)){
          const dropVids = ex.autoPart.filter((v, i) => absClip[i]);
          const dropIds = d.exercises.filter(x => x.url && dropVids.includes(extractYouTubeId(x.url))).map(x => x.id);
          d.exercises = d.exercises.filter(x => !dropIds.includes(x.id));
          d.selectedIds = (d.selectedIds || []).filter(id => !dropIds.includes(id));
        }
        let parts = [];
        titles.forEach((t, i) => { if(!absClip[i]) partsFromTitle(t).filter(p => !isAbsPart(p)).forEach(p => { if(!parts.includes(p)) parts.push(p); }); });
        if(!parts.length){ const i = absClip.indexOf(false); parts = [titles[i < 0 ? 0 : i].split('|')[0].trim()]; }
        ex.name = parts.join(' + ');

  async function loadPlaylist(){

    try{
      const c = JSON.parse(localStorage.getItem(ck) || 'null');
      if(c && c.items && c.items.length && Date.now() - c.ts < 7*864e5) return c.items;
    }catch(e){}
    const plUrl = 'https://www.youtube.com/playlist?list=' + PLAYLIST_ID;
    const fromHtml = html => {
      const out = [];
      html.split('"playlistVideoRenderer":').slice(1).forEach(chunk => {
        const v = chunk.match(/"videoId":"([\w-]{11})"/);
        const t = chunk.match(/"title":\{"runs":\[\{"text":"((?:[^"\\]|\\.)*)"/) || chunk.match(/"title":\{"simpleText":"((?:[^"\\]|\\.)*)"/);
        const s = chunk.match(/"lengthSeconds":"(\d+)"/);
        if(v && t) out.push({ vid: v[1], title: JSON.parse('"' + t[1] + '"'), secs: s ? +s[1] : 0 });
      });
      return out;
    };
    const fromMd = md => {
      const out = [], re = /\[([^\]\[]{4,200})\]\(https?:\/\/(?:www\.|m\.)?youtube\.com\/watch\?v=([\w-]{11})[^)]*\)/g;
      let m; while((m = re.exec(md))) out.push({ vid: m[2], title: m[1].trim(), secs: 0 });
      return out;
    };
    const tries = [
      ['https://api.allorigins.win/raw?url=' + encodeURIComponent(plUrl), fromHtml],
      ['https://corsproxy.io/?url=' + encodeURIComponent(plUrl), fromHtml],
      ['https://r.jina.ai/' + plUrl, fromMd]
    ];
    for(const [u, parse] of tries){
      try{
        const r = await fetch(u);
        if(!r.ok) continue;
        const seen = new Set(), items = parse(await r.text()).filter(x => !seen.has(x.vid) && seen.add(x.vid));
        if(items.length){ try{ localStorage.setItem(ck, JSON.stringify({ ts: Date.now(), items })); }catch(e){} return items; }
      }catch(e){}
    }
    return null;
  }

  // rebuild every Tue/Thu/Sat from ABS_FROM with abs clips only, continuing after the last abs clip used before
  async function rebuildAbsDays(byTitle){
    const marker = ensureDay(ABS_FROM);
    if(marker.absV2) return false;

    const past = Object.keys(data).filter(ds => /^\d{4}-\d{2}-\d{2}$/.test(ds) && ds < ABS_FROM && [0,2,4,6].includes(dowOf(ds))).sort();

  let filling = false;

    if(filling) return; filling = true;
    try{
      const pl = await loadPlaylist();
      const byTitle = {};
      (pl || []).forEach(x => { byTitle[normT(x.title)] = x.vid; });
      let changed = await rebuildAbsDays(byTitle);
      const allDays = Object.keys(data).filter(ds => /^\d{4}-\d{2}-\d{2}$/.test(ds)).sort();

      // upgrade name-only clip placeholders to real links once the playlist loads
      if(Object.keys(byTitle).length) allDays.forEach(ds => {
        (data[ds].exercises || []).forEach(x => {
          const v = x.catTitle && byTitle[normT(x.catTitle)];
          if(v){ x.url = ytUrl(v); delete x.name; delete x.catTitle;
            if(!videoTags[v] || videoTags[v] === 'exercise') videoTags[v] = x.catLabel || 'exercise'; delete x.catLabel; changed = true; }
        });
      });

      const days = allDays.filter(ds => (data[ds].exercises || []).some(x => x.autoPart && x.partV === 2 && !x.fillV7));
      const keyOf = x => x.url ? extractYouTubeId(x.url) : (x.catTitle ? normT(x.catTitle) : null);
      const lastUsed = {};
      // only days NOT being refilled count as "used" — old picks on days we rebuild must not skew the rotation
      const refill = new Set(days);
      allDays.filter(ds => !refill.has(ds)).forEach(ds => (data[ds].exercises || []).forEach(x => {
        const k = keyOf(x); if(k) lastUsed[k] = ds;
        if(x.url){ const c = CATALOG.find(c => byTitle[normT(c.title)] === extractYouTubeId(x.url)); if(c) lastUsed[normT(c.title)] = ds; }
      }));

      days.forEach(ds => {
        const d = data[ds], ex = d.exercises.find(x => x.autoPart && !x.fillV7);
        const want = ex.name.split(' + ').map(s => s.trim()).filter(p => p && p !== 'Abs' && p !== 'Core');
        // clear the day's clips (Frieza clips / earlier picks); keep the body-part name
        const dropIds = d.exercises.filter(x => x !== ex && !x.autoPart).map(x => x.id);
        d.exercises = d.exercises.filter(x => !dropIds.includes(x.id));
        d.selectedIds = (d.selectedIds || []).filter(id => !dropIds.includes(id));
        const covered = new Set(), picked = [];
        want.forEach(part => {
          if(covered.has(part)) return;
          const group = PART_GROUP[part] || [part];
          const pool = CATALOG.filter(c => !picked.includes(c) && c.parts.some(p => group.includes(p)));
          if(!pool.length) return;
          const lu = c => lastUsed[normT(c.title)] || '';
          pool.sort((a, b) => (lu(a) < lu(b) ? -1 : lu(a) > lu(b) ? 1 : 0)
            || b.parts.filter(p => want.includes(p)).length - a.parts.filter(p => want.includes(p)).length
            || CATALOG.indexOf(a) - CATALOG.indexOf(b));
          const c = pool[0];
          picked.push(c);
          lastUsed[normT(c.title)] = ds;
          want.forEach(w => { if(c.parts.some(p => (PART_GROUP[w] || [w]).includes(p))) covered.add(w); });
          const label = c.title.split('|')[0].trim().slice(0, 60);
          const v = byTitle[normT(c.title)];
          if(v){
            d.exercises.push({ id: newId(), url: ytUrl(v) });
            if(!videoTags[v] || videoTags[v] === 'exercise') videoTags[v] = label;
          } else {
            d.exercises.push({ id: newId(), url: '', name: '▶ ' + label + ' (' + fmtLen(c.secs) + ')', catTitle: c.title, catLabel: label });
          }
        });
        // warm-ups go right after the body-part name: lower body clip on leg days, playlist upper-body warm-up on upper days
        const groupsOf = w => PART_GROUP[w] || [w];
        const isLower = want.some(w => groupsOf(w).some(p => p === 'Legs' || p === 'Glutes'));
        const isUpper = want.some(w => groupsOf(w).some(p => ['Chest','Back','Shoulders','Arms','Biceps','Triceps','Forearms'].includes(p)));
        const warm = [];
        if(isLower){
          warm.push({ id: newId(), url: ytUrl(LEG_EXTRA) });
          if(!videoTags[LEG_EXTRA] || ['exercise','Legs (extra)'].includes(videoTags[LEG_EXTRA])) videoTags[LEG_EXTRA] = 'Lower Body Warm Up';
        }
        if(isUpper){
          const uv = byTitle[normT(UPPER_WARMUP.title)];
          if(uv){
            warm.push({ id: newId(), url: ytUrl(uv) });
            if(!videoTags[uv] || videoTags[uv] === 'exercise') videoTags[uv] = 'Upper Body Warm Up';
          } else {
            warm.push({ id: newId(), url: '', name: '▶ Upper Body Warm Up (' + fmtLen(UPPER_WARMUP.secs) + ')', catTitle: UPPER_WARMUP.title, catLabel: 'Upper Body Warm Up' });
          }
        }
        d.exercises.splice(d.exercises.indexOf(ex) + 1, 0, ...warm);
        const cv = byTitle[normT(COOLDOWN.title)];
        if(cv){
          d.exercises.push({ id: newId(), url: ytUrl(cv) });
          if(!videoTags[cv] || videoTags[cv] === 'exercise') videoTags[cv] = 'Cooldown';
        } else {
          d.exercises.push({ id: newId(), url: '', name: '▶ Cooldown Stretch (' + fmtLen(COOLDOWN.secs) + ')', catTitle: COOLDOWN.title, catLabel: 'Cooldown' });
        }
        ex.fillV3 = true; ex.fillV4 = true; ex.fillV5 = true; ex.fillV6 = true; ex.fillV7 = true;
        changed = true;
      });
      if(changed){ save(); renderAll(); }
    } finally { filling = false; }
  }

  renderAll();
  renderSyncPanel();
  if(!(syncKey && sb)){ if(!applyPlan()) resolveBodyParts(); }

  // if this device already has a sync code, pull the freshest copy on load
  if(syncKey && sb){
    syncStatus = 'syncing';
    renderSyncPanel();
    pullRemote(syncKey).then(function(remote){
      if(remote){
        data = remote.days || {};
        videoTags = remote.videoTags || {};
        migrateSelection();
        migrateVideoTags();
        state.days = data; state.videoTags = videoTags;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        syncStatus = 'synced';
        renderAll();
        if(!applyPlan()) resolveBodyParts();
      } else {
        applyPlan();
        // code set locally but no row yet remotely — seed it
        return pushRemote(syncKey, { days: data, videoTags: videoTags }).then(function(){
          syncStatus = 'synced';
        });
      }
    }).catch(function(err){
      console.error(err);
      syncStatus = 'error';
    }).then(function(){
      renderSyncPanel();
    });
  }
})();
</script>

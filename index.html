<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #0B1826;
    --paper-line: #14293C;
    --paper-line-strong: rgba(255,255,255,0.09);
    --ink-dark: #F2F5F8;
    --ink-blue: #EA9D2B;
    --ink-red: #A13B2C;
    --ink-red-bright: #C24B36;
    --ink-green: var(--ink-red-bright);
    --ink-on-accent: #12283D;
    --tape: rgba(234,157,43,0.25);
    --card-bg: #12253A;
    --card-bg-done: #12253A;
    --card-shadow: rgba(0,0,0,0.3);
    --muted: #6E8299;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background: var(--paper);
    color: var(--ink-dark);
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;
    letter-spacing: 0.01em;
  }

  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding: 48px 24px 100px 24px;
    position:relative;
    z-index:1;
  }
  @media (max-width:640px){ .wrap{ padding: 28px 12px 90px 12px; } }

  header.page-head{ margin-bottom: 30px; }

  .eyebrow{
    font-size:11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-blue);
    margin-bottom: 10px;
    font-weight:600;
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: 38px;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--ink-dark);
    display:inline-block;
    position:relative;
    line-height:1.1;
  }
  h1 .underline{ display:none; }
  .subtitle{ font-size:12.5px; color: var(--muted); margin-top:10px; }

  .stats-row{
    display:flex;
    gap:0;
    flex-wrap:wrap;
    margin: 0 0 34px 0;
    border-top: 1px solid var(--paper-line-strong);
    border-bottom: 1px solid var(--paper-line-strong);
  }
  .stat-tag{
    background: transparent;
    border: none;
    border-right: 1px solid var(--paper-line-strong);
    border-radius: 0;
    padding: 12px 22px 12px 0;
    margin-right: 22px;
    font-size:10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    box-shadow: none;
  }
  .stat-tag:last-child{ border-right:none; margin-right:0; }
  .stat-tag b{
    font-family:'Space Grotesk', sans-serif;
    font-size:22px;
    font-weight:600;
    color: var(--ink-dark);
    display:block;
    letter-spacing:-0.01em;
    text-transform:none;
    margin-bottom:2px;
  }
  .stat-tag.streak b{ color: var(--ink-blue); }

  .jump-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.04em;
    background: transparent;
    color: var(--ink-blue);
    border: 1px solid var(--paper-line-strong);
    padding:8px 16px;
    border-radius: 3px;
    cursor:pointer;
    box-shadow: none;
    margin-bottom: 30px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .jump-btn:hover{ border-color: var(--ink-blue); background: rgba(234,157,43,0.08); }

  .week-section{ margin-bottom: 40px; }
  .week-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
    padding-bottom:8px;
    border-bottom: 1px solid var(--paper-line-strong);
  }
  .week-toggle{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    width:20px; height:20px;
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    background: transparent;
    border: 1px solid var(--paper-line-strong);
    border-radius:4px;
    color: var(--muted);
    cursor:pointer;
    padding:0;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .week-toggle:hover{ border-color: var(--ink-blue); color: var(--ink-blue); }
  .week-head h2{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing: -0.01em;
    margin:0;
    color: var(--ink-dark);
  }
  .week-progress{
    font-size:10.5px;
    color: var(--muted);
    letter-spacing:0.03em;
  }

  .cardio-week-stat{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .cardio-week-label{
    font-size:10px;
    color: var(--muted);
    letter-spacing:0.03em;
    white-space:nowrap;
  }
  .cardio-week-stat.met .cardio-week-label{ color: var(--ink-blue); }
  .cardio-bar-track{
    width:70px;
    height:4px;
    background: var(--paper-line-strong);
    border-radius:2px;
    overflow:hidden;
  }
  .cardio-bar-fill{
    height:100%;
    background: var(--ink-blue);
    border-radius:2px;
  }
  .cardio-week-stat.met .cardio-bar-fill{ background: var(--ink-red-bright); }
  @media (max-width:520px){
    .week-head{ flex-wrap:wrap; }
    .cardio-week-stat{ margin-left:0; width:100%; }
  }

  .week-grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap:8px;
  }
  @media (max-width:820px){
    .week-grid{ grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); }
  }

  .day-cell{
    background: var(--card-bg);
    border: 1px solid var(--paper-line-strong);
    border-radius: 6px;
    padding: 10px;
    min-height:168px;
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow: none;
    transition: border-color 0.15s ease;
  }
  .day-cell:hover{ border-color: rgba(255,255,255,0.18); }
  .day-cell.today{ border-color: var(--ink-blue); }
  .day-cell.done{ background: var(--card-bg-done); opacity:0.82; }

  .day-cell .stamp-overlay{
    position:absolute;
    top:8px; right:8px;
    font-family:'Space Grotesk', sans-serif;
    font-size:11px;
    font-weight:600;
    color: var(--ink-on-accent);
    border: none;
    border-radius: 50%;
    width:18px; height:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:1;
    background: var(--ink-red-bright);
  }

  .day-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .day-head .dnum{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:16px; }
  .day-head .dow{ font-size:9.5px; color: var(--muted); text-transform:uppercase; letter-spacing:0.06em; }

  .ex-item{ margin-bottom:8px; }
  .ex-thumb-wrap{
    position:relative;
    width:100%;
    aspect-ratio: 16/9;
    border-radius:5px;
    overflow:hidden;
    border:1px solid transparent;
    background:#0C1D2E;
    transition: border-color 0.15s ease;
    margin-bottom:4px;
  }
  .ex-thumb-wrap.selected{ border-color: var(--ink-blue); box-shadow: 0 0 0 1px var(--ink-blue); }
  .ex-thumb-link{ display:block; width:100%; height:100%; }
  .ex-thumb-link img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ex-thumb-wrap.thumb-broken{
    display:flex; align-items:center; justify-content:center;
  }
  .ex-thumb-wrap.thumb-broken::before{
    content:"clip unavailable";
    font-size:9.5px;
    color: var(--muted);
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .ex-thumb-wrap .play-mini{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(0,0,0,0.18);
    pointer-events:none;
  }
  .ex-thumb-wrap .play-mini::after{
    content:"";
    width:30px; height:30px;
    border-radius:50%;
    background: rgba(0,0,0,0.55);
    display:block;
  }
  .ex-thumb-wrap .play-mini::before{
    content:"";
    position:absolute; top:50%; left:50%;
    transform: translate(-40%,-50%);
    border-style: solid;
    border-width: 7px 0 7px 11px;
    border-color: transparent transparent transparent #fff;
    z-index:1;
  }
  .ex-thumb-wrap .del-x{
    position:absolute; top:4px; right:4px;
    background: rgba(0,0,0,0.7);
    color:#fff;
    font-size:11px;
    width:20px; height:20px;
    border:none;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    line-height:1;
    cursor:pointer;
    z-index:2;
  }
  .ex-tag{
    display:block;
    width:100%;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    padding:5px 7px;
    border-radius:3px;
    border: 1px solid var(--paper-line-strong);
    background: transparent;
    color: var(--muted);
    cursor:pointer;
    text-align:left;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .ex-tag:hover{ border-color: var(--ink-blue); color: var(--ink-blue); }
  .ex-tag.selected{
    border-color: var(--ink-blue);
    color: var(--ink-blue);
    background: rgba(234,157,43,0.1);
  }

  .add-ex-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--paper-line-strong);
    border-radius:4px;
    padding: 5px 6px;
    cursor:pointer;
    width:100%;
    margin-bottom:6px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .add-ex-btn:hover{ border-color: var(--ink-blue); color: var(--ink-blue); }

  .mini-form{
    display:none;
    flex-direction:column;
    gap:4px;
    margin-bottom:6px;
    background: rgba(0,0,0,0.18);
    border: 1px solid var(--paper-line-strong);
    border-radius:4px;
    padding:6px;
  }
  .mini-form.open{ display:flex; }
  .mini-form input{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    padding:5px 6px;
    border: 1px solid var(--paper-line-strong);
    border-radius:3px;
    background: #081420;
    color: var(--ink-dark);
  }
  .mini-form input:focus{ outline: 1px solid var(--ink-blue); }
  .mini-form .mf-row{ display:flex; gap:4px; }
  .mini-form button{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:11px;
    border:none;
    border-radius:3px;
    padding:5px 8px;
    cursor:pointer;
  }
  .mini-form .mf-add{ background: var(--ink-blue); color: var(--ink-on-accent); flex:1; }
  .mini-form .mf-cancel{ background: transparent; color: var(--muted); }
  .mf-err{ font-size:9px; color: var(--ink-red-bright); min-height:11px; }

  .chosen-line{
    font-size:10.5px;
    color: var(--ink-blue);
    margin-bottom:6px;
    word-break: break-word;
    line-height:1.3;
  }

  .cardio-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:8px;
  }
  .cardio-label{
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: var(--muted);
  }
  .cardio-input{
    width:44px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    padding:3px 5px;
    border: 1px solid var(--paper-line-strong);
    border-radius:3px;
    background: #081420;
    color: var(--ink-dark);
    text-align:right;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .cardio-input::-webkit-outer-spin-button,
  .cardio-input::-webkit-inner-spin-button{
    -webkit-appearance: none;
    margin: 0;
  }
  .cardio-input:focus{ outline: 1px solid var(--ink-blue); }
  .cardio-unit{ font-size:9.5px; color: var(--muted); }

  .day-foot{ margin-top:auto; }
  .done-btn{
    width:100%;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:11.5px;
    padding:6px 0;
    border-radius:4px;
    border: 1px solid var(--paper-line-strong);
    background: transparent;
    color: var(--muted);
    cursor:pointer;
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .done-btn:hover:not(:disabled){ border-color: var(--ink-blue); color: var(--ink-blue); }
  .done-btn:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .done-btn.is-done{
    background: var(--ink-red-bright);
    border-color: var(--ink-red-bright);
    color: var(--ink-dark);
  }

  .backup-bar{
    display:flex; gap:10px; margin-top: 44px; padding-top: 18px;
    border-top: 1px solid var(--paper-line-strong);
    font-size:10.5px; flex-wrap:wrap; align-items:center;
    color: var(--muted);
  }
  .ghost-btn{
    font-family:'JetBrains Mono', monospace; font-size:10.5px;
    background: transparent; border: 1px solid var(--paper-line-strong);
    color: var(--muted); padding: 6px 12px; border-radius: 4px; cursor:pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .ghost-btn:hover{ border-color: var(--ink-blue); color: var(--ink-blue); }
  input[type=file]{ display:none; }



  @media (prefers-reduced-motion: reduce){ * { transition:none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="page-head">
    <div class="eyebrow">Training Log</div>
    <h1>Aug 23 — Oct 31, 2026</h1>
    <div class="subtitle">10 weeks · paste a clip, pick the one you're doing, check it off</div>
  </header>

  <div class="stats-row" id="statsRow"></div>
  <button class="jump-btn" id="jumpToday">jump to this week ↓</button>

  <div id="weeksContainer"></div>

  <div class="backup-bar">
    <span>data saves in this browser —</span>
    <button class="ghost-btn" id="exportBtn">export backup</button>
    <button class="ghost-btn" id="importBtn">import backup</button>
    <input type="file" id="importFile" accept="application/json">
  </div>
</div>


<script>
(function(){
  const STORAGE_KEY = 'trainingLogWeekly';
  const RANGE_START = '2026-08-23';
  const RANGE_END   = '2026-10-31';
  const CARDIO_GOAL = 150;
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function load(){
    try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : {}; }
    catch(e){ return {}; }
  }
  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

  let data = load(); // { 'YYYY-MM-DD': { exercises:[{id,title,url}], selectedId:null, done:false, cardioMins:0 } }
  let openFormDate = null; // which day's add-form is currently open

  function loadCollapsed(){
    try{
      const raw = localStorage.getItem('trainingLogCollapsedWeeks');
      return raw ? new Set(JSON.parse(raw)) : new Set();
    }catch(e){ return new Set(); }
  }
  function saveCollapsed(){
    localStorage.setItem('trainingLogCollapsedWeeks', JSON.stringify([...collapsedWeeks]));
  }
  let collapsedWeeks = loadCollapsed(); // Set of week-index strings

  function ensureDay(dateStr){
    if(!data[dateStr]) data[dateStr] = { exercises: [], selectedId: null, done: false, cardioMins: 0 };
    if(data[dateStr].cardioMins === undefined) data[dateStr].cardioMins = 0;
    return data[dateStr];
  }

  function extractYouTubeId(url){
    if(!url) return null;
    const patterns = [
      /(?:youtube\.com\/watch\?v=)([\w-]{11})/,
      /(?:youtu\.be\/)([\w-]{11})/,
      /(?:youtube\.com\/embed\/)([\w-]{11})/,
      /(?:youtube\.com\/shorts\/)([\w-]{11})/
    ];
    for(const p of patterns){ const m = url.match(p); if(m) return m[1]; }
    return null;
  }

  function toDate(s){ return new Date(s + 'T00:00:00'); }
  function fmt(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function todayStr(){ return fmt(new Date()); }

  function buildWeeks(){
    const weeks = [];
    let cursor = toDate(RANGE_START);
    const end = toDate(RANGE_END);
    while(cursor <= end){
      const week = [];
      for(let i=0;i<7;i++){
        week.push(fmt(cursor));
        cursor.setDate(cursor.getDate()+1);
      }
      weeks.push(week);
    }
    return weeks;
  }
  const WEEKS = buildWeeks();

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function weekLabel(week){
    const a = toDate(week[0]), b = toDate(week[6]);
    const optsA = { month:'short', day:'numeric' };
    const optsB = a.getMonth() === b.getMonth() ? { day:'numeric' } : { month:'short', day:'numeric' };
    return `Week of ${a.toLocaleDateString(undefined,optsA)} – ${b.toLocaleDateString(undefined,optsB)}, ${b.getFullYear()}`;
  }

  function computeStats(){
    const allDates = WEEKS.flat();
    let doneDays = 0;
    allDates.forEach(ds => {
      const d = data[ds];
      if(d && d.done) doneDays++;
    });
    // streak: consecutive done days counting back from today (or latest past day) within range
    const past = allDates.filter(ds => ds <= todayStr()).sort((a,b)=> a<b?1:-1);
    let streak = 0;
    for(const ds of past){
      if(data[ds] && data[ds].done) streak++;
      else break;
    }
    return { doneDays, streak, totalDays: allDates.length };
  }

  function renderStats(){
    const s = computeStats();
    document.getElementById('statsRow').innerHTML = `
      <div class="stat-tag"><b>${s.doneDays}/${s.totalDays}</b>days done</div>
      <div class="stat-tag streak"><b>${s.streak}</b>day streak</div>
    `;
  }

  function renderDayCell(dateStr){
    const d = data[dateStr] || { exercises:[], selectedId:null, done:false, cardioMins:0 };
    const dt = toDate(dateStr);
    const isToday = dateStr === todayStr();
    const items = d.exercises.map(ex => {
      const vid = extractYouTubeId(ex.url);
      const isSel = d.selectedId === ex.id;
      const safeTitle = escapeHtml(ex.title || 'exercise');
      const safeUrl = escapeHtml(ex.url);
      const img = vid
        ? `<img src="https://i.ytimg.com/vi/${vid}/hqdefault.jpg" alt="${safeTitle}" loading="lazy" referrerpolicy="no-referrer"
             onerror="if(this.dataset.step==='1'){this.style.display='none';this.parentElement.classList.add('thumb-broken');}else{this.dataset.step='1';this.src='https://img.youtube.com/vi/${vid}/hqdefault.jpg';}">`
        : '';
      return `
        <div class="ex-item">
          <div class="ex-thumb-wrap ${isSel?'selected':''}">
            <a class="ex-thumb-link" href="${safeUrl}" target="_blank" rel="noopener noreferrer" title="Watch on YouTube: ${safeTitle}">
              ${img}
              <div class="play-mini"></div>
            </a>
            <button class="del-x" data-del-ex="${ex.id}" data-date="${dateStr}" title="remove">✕</button>
          </div>
          <button class="ex-tag ${isSel?'selected':''}" data-select-ex="${ex.id}" data-date="${dateStr}">
            ${isSel?'✓ ':''}${safeTitle}
          </button>
        </div>`;
    }).join('');

    const formOpen = openFormDate === dateStr;

    return `
      <div class="day-cell ${isToday?'today':''} ${d.done?'done':''}" data-date="${dateStr}">
        ${d.done ? '<div class="stamp-overlay">✓</div>' : ''}
        <div class="day-head">
          <span class="dnum">${dt.getDate()}</span>
          <span class="dow">${DOW[dt.getDay()]}${isToday?' · today':''}</span>
        </div>
        <div class="ex-items">${items}</div>
        <button class="add-ex-btn" data-toggle-form="${dateStr}">${formOpen ? '– cancel' : '+ add clip'}</button>
        <div class="mini-form ${formOpen?'open':''}" data-form-for="${dateStr}">
          <input type="text" placeholder="exercise name" data-field="title" maxlength="60">
          <input type="text" placeholder="YouTube link" data-field="url" maxlength="200">
          <div class="mf-err" data-err></div>
          <div class="mf-row">
            <button type="button" class="mf-add" data-submit-form="${dateStr}">add</button>
          </div>
        </div>
        <div class="cardio-row">
          <label class="cardio-label" for="cardio-${dateStr}">cardio</label>
          <input type="number" id="cardio-${dateStr}" class="cardio-input" min="0" max="600" step="5"
                 value="${d.cardioMins || ''}" placeholder="0" data-cardio-input="${dateStr}">
          <span class="cardio-unit">min</span>
        </div>
        <div class="day-foot">
          <button class="done-btn ${d.done?'is-done':''}" data-toggle-done="${dateStr}" ${!d.selectedId?'disabled':''} title="${!d.selectedId ? 'pick an exercise below first' : ''}">
            ${d.done ? '✓ done' : 'mark done'}
          </button>
        </div>
      </div>`;
  }

  function renderWeeks(){
    const container = document.getElementById('weeksContainer');
    container.innerHTML = WEEKS.map((week, wi) => {
      const wiStr = String(wi);
      const collapsed = collapsedWeeks.has(wiStr);
      const doneCount = week.filter(ds => data[ds] && data[ds].done).length;
      const cardioTotal = week.reduce((sum, ds) => sum + ((data[ds] && data[ds].cardioMins) || 0), 0);
      const cardioPct = Math.min(100, Math.round((cardioTotal / CARDIO_GOAL) * 100));
      const goalMet = cardioTotal >= CARDIO_GOAL;
      return `
        <section class="week-section" id="week-${wi}" data-week-index="${wi}">
          <div class="week-head">
            <button class="week-toggle" data-toggle-week="${wi}" aria-expanded="${!collapsed}">${collapsed?'▸':'▾'}</button>
            <h2>${weekLabel(week)}</h2>
            <span class="week-progress">${doneCount}/7 done</span>
            <div class="cardio-week-stat ${goalMet?'met':''}">
              <span class="cardio-week-label">cardio ${cardioTotal}/${CARDIO_GOAL} min${goalMet?' ✓':''}</span>
              <div class="cardio-bar-track"><div class="cardio-bar-fill" style="width:${cardioPct}%"></div></div>
            </div>
          </div>
          <div class="week-grid" ${collapsed?'style="display:none"':''}>
            ${week.map(renderDayCell).join('')}
          </div>
        </section>`;
    }).join('');
  }

  function renderAll(){ renderStats(); renderWeeks(); }

  // --- Event delegation ---
  document.getElementById('weeksContainer').addEventListener('click', function(e){

    const toggleWeekEl = e.target.closest('[data-toggle-week]');
    if(toggleWeekEl){
      const wi = toggleWeekEl.dataset.toggleWeek;
      if(collapsedWeeks.has(wi)) collapsedWeeks.delete(wi); else collapsedWeeks.add(wi);
      saveCollapsed();
      const section = document.getElementById('week-'+wi);
      const grid = section.querySelector('.week-grid');
      const nowCollapsed = collapsedWeeks.has(wi);
      grid.style.display = nowCollapsed ? 'none' : '';
      toggleWeekEl.textContent = nowCollapsed ? '▸' : '▾';
      toggleWeekEl.setAttribute('aria-expanded', String(!nowCollapsed));
      return;
    }

    const delEl = e.target.closest('[data-del-ex]');
    if(delEl){
      const ds = delEl.dataset.date, id = delEl.dataset.delEx;
      const d = ensureDay(ds);
      d.exercises = d.exercises.filter(x => x.id !== id);
      if(d.selectedId === id){ d.selectedId = null; d.done = false; }
      save(); renderAll();
      return;
    }

    const selEl = e.target.closest('[data-select-ex]');
    if(selEl){
      const ds = selEl.dataset.date, id = selEl.dataset.selectEx;
      const d = ensureDay(ds);
      d.selectedId = (d.selectedId === id) ? null : id;
      if(!d.selectedId) d.done = false;
      save(); renderAll();
      return;
    }

    const toggleFormEl = e.target.closest('[data-toggle-form]');
    if(toggleFormEl){
      const ds = toggleFormEl.dataset.toggleForm;
      openFormDate = (openFormDate === ds) ? null : ds;
      renderWeeks();
      return;
    }

    const submitEl = e.target.closest('[data-submit-form]');
    if(submitEl){
      const ds = submitEl.dataset.submitForm;
      const formEl = document.querySelector(`[data-form-for="${ds}"]`);
      const title = formEl.querySelector('[data-field="title"]').value.trim();
      const url = formEl.querySelector('[data-field="url"]').value.trim();
      const errEl = formEl.querySelector('[data-err]');
      if(!url || !extractYouTubeId(url)){
        errEl.textContent = "paste a valid YouTube link";
        return;
      }
      const d = ensureDay(ds);
      d.exercises.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), title, url });
      openFormDate = null;
      save(); renderAll();
      return;
    }

    const doneEl = e.target.closest('[data-toggle-done]');
    if(doneEl){
      if(doneEl.disabled) return;
      const ds = doneEl.dataset.toggleDone;
      const d = ensureDay(ds);
      d.done = !d.done;
      save(); renderAll();
      return;
    }
  });

  // --- Cardio minutes input (fires on blur / enter, not every keystroke) ---
  document.getElementById('weeksContainer').addEventListener('change', function(e){
    const cardioEl = e.target.closest('[data-cardio-input]');
    if(cardioEl){
      const ds = cardioEl.dataset.cardioInput;
      const d = ensureDay(ds);
      let val = parseInt(cardioEl.value, 10);
      if(isNaN(val) || val < 0) val = 0;
      if(val > 600) val = 600;
      d.cardioMins = val;
      save(); renderAll();
    }
  });

  // --- Jump to current week ---
  document.getElementById('jumpToday').addEventListener('click', function(){
    const t = todayStr();
    const idx = WEEKS.findIndex(w => w.includes(t));
    const targetIdx = idx === -1 ? (t < RANGE_START ? 0 : WEEKS.length-1) : idx;
    const el = document.getElementById('week-'+targetIdx);
    if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  });

  // --- Backup ---
  document.getElementById('exportBtn').addEventListener('click', function(){
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'training-log-backup.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });
  document.getElementById('importBtn').addEventListener('click', function(){
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', function(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(evt){
      try{
        const imported = JSON.parse(evt.target.result);
        if(imported && typeof imported === 'object'){
          data = imported;
          save(); renderAll();
        }
      }catch(err){ alert('could not read that file'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  renderAll();
})();
</script>

</body>
</html>
